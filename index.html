<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EcoRetrofit24 | Energy retrofits for commercial buildings</title>
  <meta name="description" content="EcoRetrofit24 audits commercial buildings, plans energy upgrades and prepares the funding paperwork." />
  <meta name="theme-color" content="#12302A" />
  <link rel="icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    :root {
      --paper: #F2F5F3;
      --surface: #FFFFFF;
      --ink: #12302A;
      --ink-2: #3D514B;
      --muted: #667772;
      --line: #D2DBD7;
      --line-strong: #AEBDB7;
      --green: #0B7A4B;
      --green-soft: #E3F1E9;
      --amber-soft: #FBF1D6;
      --on-ink: #C4D3CD;

      /* Building Energy Rating band colours */
      --ber-a: #00965A;
      --ber-b: #4CAF4A;
      --ber-c: #B8D333;
      --ber-d: #FFE200;
      --ber-e: #FDB813;
      --ber-f: #F26B21;
      --ber-g: #E2262B;

      --maxw: 1180px;
      --gutter: clamp(16px, 4vw, 40px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: inherit; }
    #root { min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1 0 auto; }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
    .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 48px; padding: 0 22px;
      border-radius: 4px; border: 1.5px solid transparent;
      font-weight: 650; font-size: 15px; line-height: 1;
      cursor: pointer; text-decoration: none; white-space: nowrap;
      transition: background-color .15s ease, color .15s ease, border-color .15s ease;
    }
    .btn-ink { background: var(--ink); color: #fff; }
    .btn-ink:hover { background: var(--green); }
    .btn-line { background: transparent; color: var(--ink); border-color: var(--line-strong); }
    .btn-line:hover { border-color: var(--ink); }
    .btn-light { background: #fff; color: var(--ink); }
    .btn-light:hover { background: var(--green-soft); }
    .btn-sm { height: 40px; padding: 0 16px; font-size: 14px; }
    .btn:disabled { opacity: .7; cursor: progress; }
    .text-link { background: none; border: 0; padding: 0; cursor: pointer; color: var(--green); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

    /* ---------- Header ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(242, 245, 243, .94);
      -webkit-backdrop-filter: saturate(1.4) blur(8px);
      backdrop-filter: saturate(1.4) blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner { display: flex; align-items: center; gap: 24px; height: 68px; }
    .brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 4px 0; }
    .brand-name { font-stretch: 120%; font-weight: 800; font-size: 19px; letter-spacing: -.01em; }
    .nav { display: flex; gap: 2px; margin-left: auto; }
    .nav-link {
      position: relative;
      background: none; border: 0; cursor: pointer;
      padding: 8px 12px; border-radius: 4px;
      font-size: 15px; font-weight: 500; color: var(--ink-2);
    }
    .nav-link:hover { color: var(--ink); background: rgba(18, 48, 42, .06); }
    .nav-link[aria-current="page"] { color: var(--ink); font-weight: 650; }
    .nav .nav-link[aria-current="page"]::after {
      content: ""; position: absolute; left: 12px; right: 12px; bottom: -14px;
      height: 3px; background: var(--ink);
    }
    .menu-btn {
      display: none; align-items: center; gap: 8px;
      height: 40px; padding: 0 14px;
      border: 1.5px solid var(--line-strong); border-radius: 4px;
      background: transparent; cursor: pointer;
      font-weight: 600; font-size: 14px;
    }
    .menu-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
    .mobile-nav { display: grid; border-top: 1px solid var(--line); background: var(--paper); padding: 4px var(--gutter) 16px; }
    .mobile-nav .nav-link { text-align: left; padding: 14px 2px; font-size: 17px; border-bottom: 1px solid var(--line); border-radius: 0; }
    .mobile-nav .nav-link:hover { background: none; }
    .mobile-nav .nav-link[aria-current="page"] { color: var(--green); }

    /* ---------- Home: hero ---------- */
    .hero { padding: clamp(48px, 8vw, 96px) 0 clamp(56px, 8vw, 104px); }
    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
      gap: clamp(40px, 6vw, 88px);
      align-items: center;
    }
    .hero h1 {
      font-stretch: 112%; font-weight: 800;
      font-size: clamp(44px, 6.4vw, 82px);
      line-height: .98; letter-spacing: -.028em;
      max-width: 10ch;
    }
    .hero-lede { margin-top: 26px; font-size: clamp(17px, 1.6vw, 20px); line-height: 1.5; color: var(--ink-2); max-width: 31em; }
    .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 34px; }

    /* The rating ladder */
    .ladder-fig { margin: 0; }
    .ladder-end { font-size: 13px; font-weight: 600; color: var(--muted); }
    .ladder-end-top { margin-bottom: 10px; }
    .ladder-end-bottom { margin-top: 10px; }
    .ladder { position: relative; display: grid; gap: 8px; }
    .ladder-row { height: 42px; display: flex; align-items: center; }
    .ber {
      height: 42px; width: var(--w);
      display: flex; align-items: center; padding-left: 14px;
      background: var(--c); color: var(--t);
      font-stretch: 122%; font-weight: 800; font-size: 20px;
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%);
      animation: band-in .5s cubic-bezier(.2, .7, .2, 1) both;
      animation-delay: calc(var(--i) * 55ms);
    }
    .marker {
      position: absolute; right: 0; top: 0;
      height: 42px; width: 132px;
      display: flex; align-items: center; gap: 10px;
      padding: 0 14px 0 28px;
      clip-path: polygon(16px 0, 100% 0, 100% 100%, 16px 100%, 0 50%);
    }
    .marker small { font-size: 13px; font-weight: 500; }
    .marker strong { margin-left: auto; font-stretch: 122%; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
    .marker-now { top: 150px; background: #DCE3E0; color: var(--ink); animation: band-in .5s ease both .2s; }
    .marker-target { background: var(--ink); color: #fff; animation: climb 1.5s cubic-bezier(.22, .8, .24, 1) .6s both; }
    .ladder-caption { margin-top: 20px; font-size: 14px; color: var(--muted); max-width: 34em; }

    @keyframes band-in { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
    @keyframes climb {
      0% { transform: translateY(150px); opacity: 0; }
      18% { transform: translateY(150px); opacity: 1; }
      100% { transform: none; opacity: 1; }
    }

    /* ---------- Home: sections ---------- */
    .section { padding: clamp(56px, 8vw, 104px) 0; }
    .section-surface { background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .section-head {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px 56px; align-items: end; margin-bottom: 48px;
    }
    .section-head h2 { font-stretch: 112%; font-weight: 800; font-size: clamp(30px, 3.6vw, 46px); line-height: 1.04; letter-spacing: -.022em; max-width: 14ch; }
    .section-head p { color: var(--ink-2); font-size: 17px; max-width: 32em; }

    .measures { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 48px 32px; }
    .measure h3 { margin-top: 18px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
    .measure p { margin-top: 6px; color: var(--ink-2); font-size: 15.5px; max-width: 30em; }

    /* Video */
    .section-reel { padding-top: 0; }
    .reel { position: relative; aspect-ratio: 16 / 9; background: var(--ink); border-radius: 6px; overflow: hidden; }
    .clip { position: relative; aspect-ratio: 16 / 9; background: #DCE3E0; border-radius: 4px; overflow: hidden; }
    .reel video, .clip video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .vid-toggle {
      position: absolute; left: 16px; bottom: 16px; z-index: 2;
      display: inline-flex; align-items: center; gap: 8px;
      height: 40px; padding: 0 16px 0 13px;
      border: 0; border-radius: 999px;
      background: rgba(18, 48, 42, .8); color: #fff;
      cursor: pointer; font-size: 14px; font-weight: 600;
    }
    .vid-toggle:hover { background: var(--ink); }
    .vid-toggle svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }
    .clip .vid-toggle { left: auto; right: 10px; bottom: 10px; width: 34px; height: 34px; padding: 0; justify-content: center; }
    .clip .vid-toggle svg { width: 12px; height: 12px; }

    .chapters { list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; margin-top: 18px; }
    .chapter {
      display: block; width: 100%; padding: 0 0 4px; border: 0; background: none;
      text-align: left; cursor: pointer; color: var(--muted);
    }
    .chapter:hover { color: var(--ink-2); }
    .chapter[aria-current="step"] { color: var(--ink); }
    .chapter-track { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .chapter-fill { height: 100%; background: var(--ink); transform-origin: left center; transform: scaleX(var(--p, 0)); }
    .chapter-label { display: flex; gap: 10px; margin-top: 10px; font-size: 15px; font-weight: 600; line-height: 1.3; }
    .chapter-label b { font-stretch: 122%; font-weight: 800; }
    .reel-credit { margin-top: 20px; font-size: 13.5px; color: var(--muted); }
    .reel-credit a { color: inherit; text-underline-offset: 3px; }

    /* Project timeline */
    .gantt { border-top: 1.5px solid var(--ink); }
    .g-row {
      display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      gap: 12px 40px; align-items: center;
      padding: 24px 0; border-bottom: 1px solid var(--line);
    }
    .g-title { display: flex; align-items: baseline; gap: 12px; }
    .g-num { font-stretch: 122%; font-weight: 800; font-size: 16px; color: var(--muted); min-width: 14px; }
    .g-title h3 { font-size: 19px; font-weight: 700; line-height: 1.25; }
    .g-text p { margin: 6px 0 0 26px; color: var(--ink-2); font-size: 15.5px; max-width: 34em; }
    .g-chart { padding-bottom: 26px; }
    .g-track {
      position: relative; height: 22px;
      background-image: linear-gradient(to right, var(--line) 1px, transparent 1px);
      background-size: 20% 100%;
      border-right: 1px solid var(--line);
    }
    .g-bar {
      position: absolute; top: 0; bottom: 0;
      left: calc(var(--s) / 20 * 100%);
      width: calc(var(--d) / 20 * 100%);
      background: var(--ink); border-radius: 3px;
    }
    .g-weeks {
      position: absolute; top: 30px; left: 0;
      white-space: nowrap; font-size: 14px; font-weight: 650; color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .g-axis { padding: 14px 0 0; border-bottom: 0; }
    .g-scale { position: relative; height: 18px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .g-scale span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
    .g-scale span:first-child { transform: none; }
    .g-scale span:last-child { transform: translateX(-100%); }

    /* Call to action band */
    .cta { background: var(--ink); color: #fff; }
    .cta-inner {
      display: grid; grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px 48px; align-items: center;
      padding: clamp(48px, 7vw, 84px) var(--gutter);
    }
    .cta h2 { font-stretch: 112%; font-weight: 800; font-size: clamp(28px, 3.4vw, 44px); line-height: 1.04; letter-spacing: -.022em; max-width: 16ch; }
    .cta p { margin-top: 14px; color: var(--on-ink); font-size: 17px; max-width: 34em; }

    /* Footer */
    .footer { border-top: 1px solid var(--line); padding: 32px 0 40px; font-size: 14px; color: var(--muted); }
    .footer-inner { display: flex; flex-wrap: wrap; gap: 12px 32px; justify-content: space-between; align-items: center; }
    .footer-brand { display: flex; align-items: center; gap: 10px; color: var(--ink); font-weight: 650; }
    .footer a { color: var(--ink); text-underline-offset: 3px; }
    .footer-credit { margin-top: 18px; font-size: 13px; }
    .footer-credit a { color: inherit; }

    /* ---------- Inner pages ---------- */
    .page-head { padding-top: clamp(40px, 6vw, 72px); padding-bottom: clamp(28px, 4vw, 44px); }
    .page-head-media { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px 56px; align-items: end; }
    .head-fig { margin: 0; }
    .head-fig figcaption { margin-top: 10px; font-size: 14px; color: var(--muted); }
    .page-head h1 { font-stretch: 112%; font-weight: 800; font-size: clamp(36px, 4.8vw, 58px); line-height: 1; letter-spacing: -.026em; }
    .page-head p { margin-top: 14px; font-size: 18px; color: var(--ink-2); max-width: 36em; }
    .page-body { padding-bottom: clamp(56px, 8vw, 104px); }

    .fig-value { display: block; font-stretch: 115%; font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .fig-label { display: block; margin-top: 8px; font-size: 14px; color: var(--muted); }

    /* Energy audit */
    .stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1.5px solid var(--ink); }
    .stage { padding: 28px 28px 36px; border-left: 1px solid var(--line); }
    .stage:first-child { padding-left: 0; border-left: 0; }
    .stage-num { font-stretch: 122%; font-weight: 800; font-size: 16px; color: var(--muted); }
    .stage h2 { margin-top: 10px; font-size: 24px; font-weight: 750; letter-spacing: -.012em; line-height: 1.2; }
    .stage p { margin-top: 8px; color: var(--ink-2); max-width: 28em; }
    .figs { display: flex; flex-wrap: wrap; gap: 20px 40px; margin-top: 30px; }
    .audit-cta { margin-top: 48px; display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; }
    .audit-cta p { color: var(--ink-2); }

    /* Projects */
    .projects { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .project { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 22px; }
    .status { align-self: flex-start; font-size: 13px; font-weight: 650; padding: 4px 10px; border-radius: 999px; }
    .status-active { background: var(--green-soft); color: #075A37; }
    .status-planning { background: var(--amber-soft); color: #6E4C00; }
    .status-completed { background: var(--ink); color: #fff; }
    .project h2 { font-size: 21px; font-weight: 750; letter-spacing: -.01em; line-height: 1.2; }
    .project-loc { margin-top: 3px; color: var(--muted); font-size: 15px; }
    .project-figs { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-top: auto; }
    .project-figs .fig-value { font-size: 28px; }
    .progress { height: 6px; background: #E2E9E5; border-radius: 3px; overflow: hidden; }
    .progress span { display: block; height: 100%; background: var(--green); border-radius: 3px; }

    /* Dashboard */
    .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 40px; }
    .kpi { border-top: 1px solid var(--line); padding: 24px 0 36px; }
    .kpi:nth-child(-n+3) { border-top: 1.5px solid var(--ink); }
    .kpi-label { font-size: 15px; font-weight: 550; color: var(--ink-2); }
    .kpi-value { margin-top: 14px; font-stretch: 115%; font-weight: 800; font-size: clamp(38px, 4.4vw, 54px); line-height: 1; letter-spacing: -.024em; font-variant-numeric: tabular-nums; }
    .kpi-note { margin-top: 12px; font-size: 14px; color: var(--muted); }

    /* Client portal */
    .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .tile { border: 1.5px dashed var(--line-strong); border-radius: 6px; padding: 26px; }
    .tile-tag { display: inline-block; font-size: 13px; font-weight: 600; color: var(--muted); }
    .tile h2 { margin-top: 10px; font-size: 22px; font-weight: 750; letter-spacing: -.01em; }
    .tile p { margin-top: 6px; color: var(--ink-2); max-width: 30em; }

    /* ---------- APVA generator ---------- */
    .apva-hero {
      margin-top: clamp(24px, 4vw, 40px);
      background: var(--ink); color: #fff; border-radius: 8px;
      padding: clamp(28px, 5vw, 52px);
      display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
      gap: 32px 48px; align-items: end;
    }
    .apva-hero h1 { font-stretch: 112%; font-weight: 800; font-size: clamp(32px, 4.2vw, 52px); line-height: 1.02; letter-spacing: -.025em; max-width: 13ch; }
    .apva-hero p { margin-top: 14px; color: var(--on-ink); font-size: 17px; max-width: 30em; }
    .apva-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
    .apva-stat { border-top: 1px solid rgba(255, 255, 255, .25); padding-top: 14px; display: flex; flex-direction: column-reverse; }
    .apva-stat dd { font-weight: 800; font-size: clamp(24px, 2.5vw, 32px); line-height: 1; font-variant-numeric: tabular-nums; }
    .apva-stat dt { margin-top: 8px; font-size: 13px; color: #A9BDB5; }

    .apva-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; margin-top: 24px; align-items: start; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: clamp(20px, 3vw, 34px); }
    .panel-aside { position: sticky; top: 92px; }
    .panel-head { margin-bottom: 32px; }
    .panel-head h2 { font-size: 24px; font-weight: 750; letter-spacing: -.012em; }
    .panel-head p { margin-top: 4px; color: var(--ink-2); }

    .fieldset { margin-bottom: 36px; }
    .fieldset-title {
      display: flex; gap: 12px; align-items: baseline;
      font-size: 18px; font-weight: 750;
      padding-bottom: 12px; margin-bottom: 20px; border-bottom: 1px solid var(--line);
    }
    .fieldset-title span { font-stretch: 122%; font-weight: 800; color: var(--muted); }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 20px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field-full { grid-column: 1 / -1; }
    .field-label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
    .input {
      width: 100%; height: 48px; padding: 0 14px;
      border: 1.5px solid var(--line); border-radius: 4px; background: #fff;
      font-size: 15px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .input::placeholder { color: #93A29D; }
    .input:hover { border-color: var(--line-strong); }
    .input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(11, 122, 75, .16); }
    textarea.input { height: auto; min-height: 112px; padding: 12px 14px; resize: vertical; line-height: 1.5; }
    select.input {
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%233D514B' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.6' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 12px center; background-repeat: no-repeat; background-size: 16px;
      padding-right: 40px;
    }
    .ber-tag {
      display: inline-flex; align-items: center; height: 22px; padding: 0 14px 0 8px;
      background: var(--c); color: var(--t);
      font-stretch: 122%; font-weight: 800; font-size: 13px;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%);
    }
    .hint { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
    .chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .chip {
      display: flex; align-items: center; gap: 10px;
      min-height: 50px; padding: 10px 14px;
      border: 1.5px solid var(--line); border-radius: 4px; background: #fff;
      cursor: pointer; font-size: 15px; font-weight: 500; line-height: 1.25;
      transition: border-color .15s ease, background-color .15s ease;
    }
    .chip:hover { border-color: var(--line-strong); }

          const heatPumpSize = Math.round(data.floorArea / 15);

    function useInView(ref, threshold) {
      const [inView, setInView] = useState(false);
      useEffect(() => {
        const el = ref.current;
        if (!el || !('IntersectionObserver' in window)) { setInView(true); return; }
        const io = new IntersectionObserver(([entry]) => setInView(entry.isIntersecting), { threshold });
        io.observe(el);
        return () => io.disconnect();
      }, []);
      return inView;
    }

    function startVideo(v) {
      if (!v) return;

    // A short muted loop that plays only while it is on screen
    function LoopVideo({ clip, label }) {
      const box = useRef(null);
      const vid = useRef(null);
      const inView = useInView(box, 0.35);
      const [wantPlay, setWantPlay] = useState(canAutoplay);
      const [playing, setPlaying] = useState(false);

      useEffect(() => {
        if (inView && wantPlay) startVideo(vid.current);
        else if (vid.current) vid.current.pause();
      }, [inView, wantPlay]);

      const toggle = () => {
        if (playing) { setWantPlay(false); vid.current.pause(); }
        else { setWantPlay(true); startVideo(vid.current); }
      };

      return (
        <div className="clip" ref={box}>
          <video ref={vid} src={clip.src} poster={clip.poster} muted loop playsInline preload="none" aria-hidden="true"
            onPlay={() => setPlaying(true)} onPause={() => setPlaying(false)} />
          <button type="button" className="vid-toggle" onClick={toggle} aria-label={`${playing ? 'Pause' : 'Play'} ${label} video`}>
            {playing ? <PauseIcon /> : <PlayIcon />}
          </button>
        </div>
      );
    }

    // The install film: four clips played in order, with a chapter bar under each
    function InstallReel() {
      const box = useRef(null);
      const vid = useRef(null);
      const fills = useRef([]);
      const inView = useInView(box, 0.4);
      const [idx, setIdx] = useState(0);
      const [wantPlay, setWantPlay] = useState(canAutoplay);
      const [playing, setPlaying] = useState(false);

      useEffect(() => {
        if (inView && wantPlay) startVideo(vid.current);
        else if (vid.current) vid.current.pause();
      }, [inView, wantPlay, idx]);

      useEffect(() => {
        const paint = () => {
          const v = vid.current;
          const now = v && v.duration ? Math.min(1, v.currentTime / v.duration) : 0;
          fills.current.forEach((el, i) => {
            if (el) el.style.setProperty('--p', i < idx ? 1 : i > idx ? 0 : now);
          });
        };
        paint();
        if (!playing) return;
        let raf;
        const loop = () => { paint(); raf = requestAnimationFrame(loop); };
        raf = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(raf);
      }, [idx, playing]);

      const toggle = () => {
        if (playing) { setWantPlay(false); vid.current.pause(); }
        else { setWantPlay(true); startVideo(vid.current); }
      };
      const jump = (i) => { setWantPlay(true); setIdx(i); };

      return (
        <div ref={box}>
          <div className="reel">
            <video ref={vid} src={REEL[idx].src} poster={REEL[idx].poster} muted playsInline preload="metadata"

              <div className="section-head">
                <h2>What a retrofit can include</h2>
                <p>Every building is different, so the audit decides the mix. These are the six measures we plan and price.</p>
              </div>
              <div className="measures">
                {MEASURES.map(m => (
                  <div className="measure" key={m.title}>
                    <LoopVideo clip={CLIPS[m.icon]} label={m.title} />
                    <h3>{m.title}</h3>
                    <p>{m.text}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>

          <section className="section" ref={howRef} style={{ scrollMarginTop: '68px' }}>
            <div className="wrap">
              <div className="section-head">
                <h2>How a project runs</h2>
                <p>Four phases, roughly 13 to 19 weeks from the first survey to handover.</p>
              </div>
              <div className="gantt">
                {PHASES.map(ph => (
                  <div className="g-row" key={ph.n}>
                    <div className="g-text">
                      <div className="g-title"><span className="g-num">{ph.n}</span><h3>{ph.title}</h3></div>
                      <p>{ph.text}</p>
                    </div>
                    <div className="g-chart">
                      <div className="g-track">
                        <div className="g-bar" style={{ '--s': ph.s, '--d': ph.d }}>
                          <span className="g-weeks">{ph.weeks}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
                <div className="g-row g-axis" aria-hidden="true">
                  <div></div>
                  <div className="g-scale">
                    {[0, 4, 8, 12, 16, 20].map(n => (
                      <span key={n} style={{ left: (n / 20 * 100) + '%' }}>{n === 20 ? '20 weeks' : n}</span>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section className="cta">
            <div className="cta-inner" style={{ maxWidth: 'var(--maxw)', margin: '0 auto' }}>
              <div>
                <h2>Put numbers on your building</h2>
                <p>Fill in your building details and download a draft APVA application as a PDF, with costs, savings and payback worked out.</p>
              </div>
              <button className="btn btn-light" onClick={() => go('apva')}>Start your application</button>
            </div>
          </section>
        </>
      );
    }

    /* ---------- Inner pages ---------- */

    function PageHead({ title, children }) {
      return (
        <div className="wrap page-head">
          <h1>{title}</h1>
          {children && <p>{children}</p>}
        </div>
      );
    }

    const STAGES = [
      { title: 'Building assessment', text: 'Complete thermal imaging and energy performance evaluation.', figs: [['15', 'Data points'], ['98%', 'Accuracy']] },
      { title: 'Performance analysis', text: 'Detailed energy consumption patterns and efficiency opportunities.', figs: [['24/7', 'Monitoring'], ['45%', 'Average savings']] },
      { title: 'Optimization plan', text: 'Customized recommendations for maximum energy efficiency gains.', figs: [['3.2x', 'Return on investment'], ['2–4', 'Years to pay back']] }
    ];

    function AuditPage({ go }) {
      return (
        <>
          <div className="wrap page-head page-head-media">
            <div>
              <h1>Energy audit</h1>
              <p>A full assessment of how your building uses energy, and a plan for what to change first.</p>
            </div>
            <figure className="head-fig">
              <LoopVideo clip={CLIPS.audit} label="Thermal imaging" />
              <figcaption>A thermal camera shows where heat escapes through walls and windows.</figcaption>
            </figure>
          </div>
          <div className="wrap page-body">
            <div className="stages">
              {STAGES.map((st, i) => (
                <div className="stage" key={st.title}>
                  <div className="stage-num">{i + 1}</div>
                  <h2>{st.title}</h2>
                  <p>{st.text}</p>
                  <div className="figs">
                    {st.figs.map(([v, l]) => (
                      <div key={l}><span className="fig-value">{v}</span><span className="fig-label">{l}</span></div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
            <div className="audit-cta">
              <a className="btn btn-ink" href="mailto:tebaiwaqar@gmail.com?subject=Energy%20audit%20enquiry">Ask about an audit</a>
              <p>Or <button className="text-link" onClick={() => go('apva')}>start a draft application</button> if you already have your building's figures.</p>
            </div>
          </div>
        </>
      );
    }

    const PROJECTS = [
      { name: 'Dublin Office Complex', loc: 'Sandyford, Dublin 18', status: 'Active', cls: 'status-active', invest: '€340K', done: 65 },
      { name: 'Cork Manufacturing Plant', loc: 'Little Island, Cork', status: 'Planning', cls: 'status-planning', invest: '€580K', done: 15 },
      { name: 'Galway Retail Center', loc: 'Galway City Centre', status: 'Completed', cls: 'status-completed', invest: '€220K', done: 100 }
    ];

    function ProjectsPage() {
      return (
        <>
          <PageHead title="Projects">Current and recent retrofit work across the portfolio.</PageHead>
          <div className="wrap page-body">
            <div className="projects">
              {PROJECTS.map(p => (
                <article className="project" key={p.name}>
                  <span className={`status ${p.cls}`}>{p.status}</span>
                  <div>
                    <h2>{p.name}</h2>
                    <div className="project-loc">{p.loc}</div>
                  </div>
                  <div className="project-figs">
                    <div><span className="fig-value">{p.invest}</span><span className="fig-label">Investment</span></div>
                    <div style={{ textAlign: 'right' }}><span className="fig-value">{p.done}%</span><span className="fig-label">Complete</span></div>
                  </div>
                  <div className="progress" role="progressbar" aria-valuenow={p.done} aria-valuemin="0" aria-valuemax="100" aria-label={`${p.name} progress`}>
                    <span style={{ width: p.done + '%' }}></span>
                  </div>
                </article>
              ))}
            </div>
          </div>
        </>
      );
    }

    const KPIS = [
      ['Total portfolio value', '€2.4M', '+18% from last quarter'],
      ['Active projects', '12', '3 completing this month'],
      ['Energy savings', '847 MWh', 'Annual reduction achieved'],
      ['CO₂ reduction', '312 t', 'Tonnes avoided each year'],
      ['ROI performance', '24.7%', 'Average portfolio return'],
      ['Grant success rate', '89%', 'Applications approved']
    ];

    function DashboardPage() {
      return (
        <>
          <PageHead title="Portfolio dashboard">An overview of your energy retrofit portfolio and its key figures.</PageHead>
          <div className="wrap page-body">
            <div className="kpis">
              {KPIS.map(([label, value, note]) => (
                <div className="kpi" key={label}>
                  <div className="kpi-label">{label}</div>
                  <div className="kpi-value">{value}</div>
                  <div className="kpi-note">{note}</div>
                </div>
              ))}
            </div>
          </div>
        </>
      );
    }

    const TOOLS = [
      ['Clients', 'Project tracking, document sharing and messaging for each client in one place.'],
      ['Documents', 'Secure document storage with version control and team collaboration.'],
      ['Reports', 'Reporting and analytics for tracking portfolio performance over time.'],
      ['AI insights', 'Recommendations and forecasts drawn from your building and project data.']
    ];

    function PortalPage() {
      return (
        <>
          <PageHead title="Client portal">Tools for clients to follow their projects. These are still being built.</PageHead>
          <div className="wrap page-body">
            <div className="tiles">
              {TOOLS.map(([title, text]) => (
                <div className="tile" key={title}>
                  <span className="tile-tag">In development</span>
                  <h2>{title}</h2>
                  <p>{text}</p>
                </div>
              ))}
            </div>
          </div>
        </>
      );
    }

    /* ---------- App shell ---------- */

    function EcoRetrofit24Platform() {
      const [view, setView] = useState(viewFromHash);
      const [menuOpen, setMenuOpen] = useState(false);

      useEffect(() => {
        const onHash = () => { setView(viewFromHash()); window.scrollTo(0, 0); };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      useEffect(() => {
        const current = VIEWS.find(v => v.id === view);
        document.title = view === 'home'
          ? 'EcoRetrofit24 | Energy retrofits for commercial buildings'
          : `${current.label} | EcoRetrofit24`;
      }, [view]);

      const go = (id) => {
        setMenuOpen(false);
        if (id !== view) {
          if (id === 'home') {
            history.pushState(null, '', window.location.pathname + window.location.search);
            setView('home');
          } else {
            window.location.hash = id;
          }
        }
        window.scrollTo({ top: 0, behavior: 'instant' });
      };

      const navLinks = VIEWS.map(v => (
        <button key={v.id} className="nav-link" aria-current={view === v.id ? 'page' : undefined} onClick={() => go(v.id)}>
          {v.label}
        </button>
      ));

      let page;
      switch (view) {
        case 'audit': page = <AuditPage go={go} />; break;
        case 'projects': page = <ProjectsPage />; break;
        case 'dashboard': page = <DashboardPage />; break;
        case 'apva': page = <APVAGenerator />; break;
        case 'portal': page = <PortalPage />; break;
        default: page = <Home go={go} />;
      }

      return (
        <>
          <header className="topbar">
            <div className="wrap topbar-inner">
              <button className="brand" onClick={() => go('home')} aria-label="EcoRetrofit24 home">
                <Logo />
                <span className="brand-name">EcoRetrofit24</span>
              </button>
              <nav className="nav" aria-label="Main">{navLinks}</nav>
              <button className="btn btn-ink btn-sm header-cta" onClick={() => go('apva')}>Start application</button>
              <button className="menu-btn" aria-expanded={menuOpen} aria-controls="mobile-nav" onClick={() => setMenuOpen(o => !o)}>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  {menuOpen ? <path d="M6 6l12 12M18 6L6 18" /> : <path d="M4 7h16M4 12h16M4 17h16" />}
                </svg>
                {menuOpen ? 'Close' : 'Menu'}
              </button>
            </div>
            {menuOpen && <nav id="mobile-nav" className="mobile-nav" aria-label="Main">{navLinks}</nav>}
          </header>

          <main>{page}</main>

          <footer className="footer">
            <div className="wrap footer-inner">
              <div className="footer-brand"><Logo size={22} /> EcoRetrofit24</div>
              <div>Founded by Waqar Lund, CEO</div>
              <a href="mailto:tebaiwaqar@gmail.com">tebaiwaqar@gmail.com</a>
              <div>© {new Date().getFullYear()} EcoRetrofit24</div>
            </div>
            <div className="wrap footer-credit">
              Stock video from <a href="https://www.pexels.com" target="_blank" rel="noopener">Pexels</a> by Los Muertos Crew, Kindel Media, UrbanGrid, Daniel Coetsee, Rec Everywhere, Gustavo Fring, Jakub Bukowski and Frank Schrader.
            </div>
          </footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<EcoRetrofit24Platform />);
  </script>
</body>
</html>
