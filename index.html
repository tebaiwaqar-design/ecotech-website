  <style>
    :root {
      --paper: #F2F5F3;
      --surface: #FFFFFF;
      --ink: #12302A;
      --ink-2: #3D514B;
      --muted: #667772;
      --line: #D2DBD7;
      --line-strong: #AEBDB7;
      --green: #0B7A4B;
      --green-soft: #E3F1E9;
      --on-ink: #C4D3CD;
      --on-ink-muted: #93AAA2;
      --danger: #B42318;

      /* Building Energy Rating band colours */
      --ber-a: #00965A;
      --ber-b: #4CAF4A;
      --ber-c: #B8D333;
      --ber-d: #FFE200;
      --ber-e: #FDB813;
      --ber-f: #F26B21;
      --ber-g: #E2262B;

      --maxw: 1180px;
      --gutter: clamp(16px, 4vw, 40px);
      --header-h: 68px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 8px); }
    body {
      font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: inherit; }
    img, svg, video { display: block; }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
    #root { min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1 0 auto; }
    .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }
    .skip {
      position: absolute; left: 12px; top: -60px; z-index: 100;
      background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 4px; font-weight: 600;
    }
    .skip:focus { top: 12px; }
    .boot { padding: 120px var(--gutter); max-width: 640px; margin: 0 auto; color: var(--ink-2); }

    /* ---------- Buttons and links ---------- */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 48px; padding: 0 22px;
      border-radius: 4px; border: 1.5px solid transparent;
      font-weight: 650; font-size: 15px; line-height: 1;
      cursor: pointer; text-decoration: none; white-space: nowrap;
      transition: background-color .15s ease, color .15s ease, border-color .15s ease;
    }
    .btn-ink { background: var(--ink); color: #fff; }
    .btn-ink:hover { background: var(--green); }
    .btn-line { background: transparent; color: var(--ink); border-color: var(--line-strong); }
    .btn-line:hover { border-color: var(--ink); }
    .btn-sm { height: 40px; padding: 0 16px; font-size: 14px; }
    .btn:disabled { opacity: .7; cursor: progress; }
    .link { color: var(--green); font-weight: 600; text-underline-offset: 3px; }
    .link-ext::after { content: " \2197"; font-weight: 500; }

    /* ---------- Header ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(242, 245, 243, .94);
      -webkit-backdrop-filter: saturate(1.4) blur(8px);
      backdrop-filter: saturate(1.4) blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .topbar-inner { display: flex; align-items: center; gap: 24px; height: var(--header-h); }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; padding: 4px 0; }
    .brand-name { font-stretch: 120%; font-weight: 800; font-size: 19px; letter-spacing: -.01em; }
    .nav { display: flex; gap: 2px; margin-left: auto; }
    .nav a {
      position: relative; text-decoration: none;
      padding: 8px 12px; border-radius: 4px;
      font-size: 15px; font-weight: 500; color: var(--ink-2);
    }
    .nav a:hover { color: var(--ink); background: rgba(18, 48, 42, .06); }
    .nav a[aria-current="page"] { color: var(--ink); font-weight: 650; }
    .nav a[aria-current="page"]::after {
      content: ""; position: absolute; left: 12px; right: 12px; bottom: -14px;
      height: 3px; background: var(--ink);
    }
    .menu-btn {
      display: none; align-items: center; gap: 8px;
      height: 40px; padding: 0 14px;
      border: 1.5px solid var(--line-strong); border-radius: 4px;
      background: transparent; cursor: pointer;
      font-weight: 600; font-size: 14px;
    }
    .menu-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
    .mobile-nav { display: grid; border-top: 1px solid var(--line); background: var(--paper); padding: 4px var(--gutter) 16px; }
    .mobile-nav a { padding: 14px 2px; font-size: 17px; text-decoration: none; border-bottom: 1px solid var(--line); color: var(--ink-2); }
    .mobile-nav a[aria-current="page"] { color: var(--green); font-weight: 650; }

    /* ---------- Shared section layout ---------- */
    .section { padding: clamp(64px, 9vw, 112px) 0; }
    .section-surface { background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .section-head {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px 56px; align-items: end; margin-bottom: 48px;
    }
    .h2 { font-stretch: 112%; font-weight: 800; font-size: clamp(30px, 3.6vw, 46px); line-height: 1.04; letter-spacing: -.022em; max-width: 15ch; }
    .section-head p { color: var(--ink-2); font-size: 17px; max-width: 32em; }

    /* ---------- Hero ---------- */
    .hero { padding: clamp(48px, 8vw, 96px) 0 clamp(64px, 9vw, 112px); }
    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
      gap: clamp(40px, 6vw, 88px);
      align-items: center;
    }
    .hero h1 {
      font-stretch: 112%; font-weight: 800;
      font-size: clamp(44px, 6.4vw, 82px);
      line-height: .98; letter-spacing: -.028em;
      max-width: 10ch;
    }
    .hero-lede { margin-top: 26px; font-size: clamp(17px, 1.6vw, 20px); line-height: 1.5; color: var(--ink-2); max-width: 31em; }
    .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 34px; }
    .hero-points { list-style: none; display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 28px; font-size: 15px; color: var(--ink-2); }
    .hero-points li { display: flex; align-items: center; gap: 8px; }
    .tick { width: 16px; height: 16px; flex-shrink: 0; stroke: var(--green); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

    /* Rating ladder */
    .ladder-fig { margin: 0; }
    .ladder-end { font-size: 13px; font-weight: 600; color: var(--muted); }
    .ladder-end-top { margin-bottom: 10px; }
    .ladder-end-bottom { margin-top: 10px; }
    .ladder { position: relative; display: grid; gap: 8px; }
    .ladder-row { height: 42px; display: flex; align-items: center; }
    .ber {
      height: 42px; width: var(--w);
      display: flex; align-items: center; padding-left: 14px;
      background: var(--c); color: var(--t);
      font-stretch: 122%; font-weight: 800; font-size: 20px;
      clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%);
      animation: band-in .5s cubic-bezier(.2, .7, .2, 1) both;
      animation-delay: calc(var(--i) * 55ms);
    }
    .marker {
      position: absolute; right: 0; top: 0;
      height: 42px; width: 132px;
      display: flex; align-items: center; gap: 10px;
      padding: 0 14px 0 28px;
      clip-path: polygon(16px 0, 100% 0, 100% 100%, 16px 100%, 0 50%);
    }
    .marker small { font-size: 13px; font-weight: 500; }
    .marker strong { margin-left: auto; font-stretch: 122%; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
    .marker-now { top: 150px; background: #DCE3E0; color: var(--ink); animation: band-in .5s ease both .2s; }
    .marker-target { background: var(--ink); color: #fff; animation: climb 1.5s cubic-bezier(.22, .8, .24, 1) .6s both; }
    .ladder-caption { margin-top: 20px; font-size: 14px; color: var(--muted); max-width: 34em; }
    @keyframes band-in { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
    @keyframes climb {
      0% { transform: translateY(150px); opacity: 0; }
      18% { transform: translateY(150px); opacity: 1; }
      100% { transform: none; opacity: 1; }
    }

    /* ---------- Services ---------- */
    .feature {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
      gap: 32px 56px; align-items: center;
      padding-bottom: 56px; margin-bottom: 48px; border-bottom: 1px solid var(--line);
    }
    .service-num { font-stretch: 122%; font-weight: 800; font-size: 16px; color: var(--muted); }
    .feature h3 { margin-top: 8px; font-stretch: 108%; font-size: clamp(24px, 2.4vw, 30px); font-weight: 800; letter-spacing: -.018em; line-height: 1.12; }
    .feature p { margin-top: 12px; color: var(--ink-2); font-size: 17px; max-width: 32em; }
    .checklist { list-style: none; display: grid; gap: 10px; margin-top: 22px; }
    .checklist li { display: grid; grid-template-columns: 16px 1fr; gap: 12px; align-items: start; color: var(--ink-2); }
    .checklist .tick { margin-top: 4px; }
    .feature-fig { margin: 0; }
    .feature-fig figcaption { margin-top: 10px; font-size: 14px; color: var(--muted); }
    .services { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; }
    .service h3 { margin-top: 8px; font-size: 21px; font-weight: 750; letter-spacing: -.012em; line-height: 1.2; }
    .service p { margin-top: 8px; color: var(--ink-2); max-width: 30em; }

    /* ---------- Video ---------- */
    .reel { position: relative; aspect-ratio: 16 / 9; background: var(--ink); border-radius: 6px; overflow: hidden; }
    .clip { position: relative; aspect-ratio: 16 / 9; background: #DCE3E0; border-radius: 4px; overflow: hidden; }
    .reel video, .clip video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .vid-toggle {
      position: absolute; left: 16px; bottom: 16px; z-index: 2;
      display: inline-flex; align-items: center; gap: 8px;
      height: 40px; padding: 0 16px 0 13px;
      border: 0; border-radius: 999px;
      background: rgba(18, 48, 42, .8); color: #fff;
      cursor: pointer; font-size: 14px; font-weight: 600;
    }
    .vid-toggle:hover { background: var(--ink); }
    .vid-toggle svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }
    .clip .vid-toggle { left: auto; right: 10px; bottom: 10px; width: 34px; height: 34px; padding: 0; justify-content: center; }
    .clip .vid-toggle svg { width: 12px; height: 12px; }
    .chapters { list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; margin-top: 18px; }
    .chapter { display: block; width: 100%; padding: 0 0 4px; border: 0; background: none; text-align: left; cursor: pointer; color: var(--muted); }
    .chapter:hover { color: var(--ink-2); }
    .chapter[aria-current="step"] { color: var(--ink); }
    .chapter-track { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .chapter-fill { height: 100%; background: var(--ink); transform-origin: left center; transform: scaleX(var(--p, 0)); }
    .chapter-label { display: flex; gap: 10px; margin-top: 10px; font-size: 15px; font-weight: 600; line-height: 1.3; }
    .chapter-label b { font-stretch: 122%; font-weight: 800; }
    .credit { margin-top: 20px; font-size: 13.5px; color: var(--muted); }
    .credit a { color: inherit; text-underline-offset: 3px; }

    /* Upgrade measures */
    .measures { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 48px 32px; margin-top: 72px; }
    .measure h3 { margin-top: 18px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
    .measure p { margin-top: 6px; color: var(--ink-2); font-size: 15.5px; max-width: 30em; }

    /* ---------- Process timeline ---------- */
    .gantt { border-top: 1.5px solid var(--ink); }
    .g-row {
      display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
      gap: 12px 40px; align-items: center;
      padding: 24px 0; border-bottom: 1px solid var(--line);
    }
    .g-title { display: flex; align-items: baseline; gap: 12px; }
    .g-num { font-stretch: 122%; font-weight: 800; font-size: 16px; color: var(--muted); min-width: 14px; }
    .g-title h3 { font-size: 19px; font-weight: 700; line-height: 1.25; }
    .g-text p { margin: 6px 0 0 26px; color: var(--ink-2); font-size: 15.5px; max-width: 34em; }
    .g-chart { padding-bottom: 26px; }
    .g-track {
      position: relative; height: 22px;
      background-image: linear-gradient(to right, var(--line) 1px, transparent 1px);
      background-size: 20% 100%;
      border-right: 1px solid var(--line);
    }
    .g-bar { position: absolute; top: 0; bottom: 0; left: calc(var(--s) / 20 * 100%); width: calc(var(--d) / 20 * 100%); background: var(--ink); border-radius: 3px; }
    .g-weeks { position: absolute; top: 30px; left: 0; white-space: nowrap; font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .g-axis { padding: 14px 0 0; border-bottom: 0; }
    .g-scale { position: relative; height: 18px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .g-scale span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
    .g-scale span:first-child { transform: none; }
    .g-scale span:last-child { transform: translateX(-100%); }

    /* ---------- Funding ---------- */
    .schemes { border-top: 1.5px solid var(--ink); }
    .scheme {
      display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 6fr) auto;
      gap: 10px 40px; align-items: baseline;
      padding: 26px 0; border-bottom: 1px solid var(--line);
    }
    .scheme h3 { font-size: 19px; font-weight: 750; line-height: 1.25; letter-spacing: -.008em; }
    .scheme-key { margin-top: 4px; font-size: 15px; font-weight: 600; color: var(--green); }
    .scheme p { color: var(--ink-2); font-size: 15.5px; max-width: 38em; }
    .scheme .link { font-size: 15px; white-space: nowrap; }
    .note { margin-top: 22px; font-size: 14px; color: var(--muted); max-width: 52em; }

    /* ---------- About ---------- */
    .about { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px 72px; }
    .about-text p { margin-top: 16px; color: var(--ink-2); font-size: 17px; max-width: 32em; }
    .principles { display: grid; gap: 26px; }
    .principle { border-top: 1.5px solid var(--ink); padding-top: 18px; }
    .principle h3 { font-size: 19px; font-weight: 750; letter-spacing: -.008em; }
    .principle p { margin-top: 6px; color: var(--ink-2); max-width: 34em; }
    .sectors { margin-top: 64px; padding-top: 36px; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 20px 72px; }
    .sectors h3 { font-size: 19px; font-weight: 750; }
    .sector-list { list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 32px; }
    .sector-list li { font-size: 17px; font-weight: 550; padding-bottom: 12px; border-bottom: 1px solid var(--line); }

    /* ---------- Contact ---------- */
    .contact { background: var(--ink); color: #fff; }
    .contact-grid { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 40px 72px; align-items: start; }
    .contact .h2 { color: #fff; }
    .contact-intro p { margin-top: 16px; color: var(--on-ink); font-size: 17px; max-width: 30em; }
    .contact-mail { display: inline-block; margin-top: 28px; font-size: clamp(19px, 2vw, 24px); font-weight: 700; color: #fff; text-underline-offset: 5px; text-decoration-thickness: 1.5px; word-break: break-all; }
    .contact-steps { list-style: none; margin-top: 36px; display: grid; gap: 14px; counter-reset: s; }
    .contact-steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; color: var(--on-ink); counter-increment: s; }
    .contact-steps li::before { content: counter(s); font-stretch: 122%; font-weight: 800; color: #fff; }

    /* ---------- Forms ---------- */
    .panel { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: clamp(20px, 3vw, 34px); }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 20px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field-full { grid-column: 1 / -1; }
    .field-label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
    .field-label .opt { font-weight: 400; color: var(--muted); }
    .field-hint { font-size: 13.5px; color: var(--muted); line-height: 1.4; }
    .field-error { font-size: 13.5px; color: var(--danger); font-weight: 550; }
    .input {
      width: 100%; height: 48px; padding: 0 14px;
      border: 1.5px solid var(--line); border-radius: 4px; background: #fff;
      font-size: 15px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .input::placeholder { color: #93A29D; }
    .input:hover { border-color: var(--line-strong); }
    .input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(11, 122, 75, .16); }
    .input[aria-invalid="true"] { border-color: var(--danger); }
    textarea.input { height: auto; min-height: 120px; padding: 12px 14px; resize: vertical; line-height: 1.5; }
    select.input {
      appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%233D514B' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.6' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
      background-position: right 12px center; background-repeat: no-repeat; background-size: 16px;
      padding-right: 40px;
    }
    .form-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; margin-top: 24px; }
    .form-foot p { font-size: 14px; color: var(--muted); max-width: 34em; }
    .status { margin-top: 18px; padding: 16px 18px; border-radius: 6px; background: var(--green-soft); border: 1.5px solid var(--green); color: #064A2E; font-size: 15px; }
    .status strong { display: block; font-weight: 750; }

    /* ---------- Estimate tool ---------- */
    .page-head { padding-top: clamp(40px, 6vw, 72px); padding-bottom: clamp(28px, 4vw, 40px); }
    .page-head h1 { font-stretch: 112%; font-weight: 800; font-size: clamp(36px, 4.8vw, 58px); line-height: 1; letter-spacing: -.026em; }
    .page-head p { margin-top: 14px; font-size: 18px; color: var(--ink-2); max-width: 38em; }
    .page-body { padding-bottom: clamp(64px, 9vw, 112px); }
    .est-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
    .est-aside { position: sticky; top: calc(var(--header-h) + 24px); display: grid; gap: 16px; }
    .fieldset { margin-bottom: 36px; border: 0; }
    .fieldset-title {
      display: flex; gap: 12px; align-items: baseline;
      font-size: 18px; font-weight: 750;
      padding-bottom: 12px; margin-bottom: 20px; border-bottom: 1px solid var(--line); width: 100%;
    }
    .fieldset-title span { font-stretch: 122%; font-weight: 800; color: var(--muted); }
    .hint { font-size: 14px; color: var(--muted); margin-bottom: 14px; max-width: 46em; }
    .ber-tag {
      display: inline-flex; align-items: center; height: 22px; padding: 0 14px 0 8px;
      background: var(--c); color: var(--t);
      font-stretch: 122%; font-weight: 800; font-size: 13px;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%);
    }
    .chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .chip {
      display: flex; align-items: center; gap: 10px;
      min-height: 50px; padding: 10px 14px;
      border: 1.5px solid var(--line); border-radius: 4px; background: #fff;
      cursor: pointer; font-size: 15px; font-weight: 500; line-height: 1.25;
      transition: border-color .15s ease, background-color .15s ease;
    }
    .chip:hover { border-color: var(--line-strong); }
    .chip input { width: 18px; height: 18px; accent-color: var(--green); flex-shrink: 0; }
    .chip.is-on { border-color: var(--green); background: var(--green-soft); }
    .chip:focus-within { outline: 2px solid var(--green); outline-offset: 2px; }
    .generate { width: 100%; height: 56px; font-size: 16px; }
    .summary-title { font-size: 20px; font-weight: 750; letter-spacing: -.01em; }
    .summary-sub { margin-top: 2px; font-size: 14px; color: var(--muted); }
    .figures { margin-top: 18px; display: grid; gap: 0; }
    .figure { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); }
    .figure dt { font-size: 14.5px; color: var(--ink-2); }
    .figure dd { font-stretch: 112%; font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; text-align: right; }
    .figure-total dd { font-size: 26px; }
    .summary-empty { margin-top: 16px; font-size: 14.5px; color: var(--muted); }
    .aside-list { list-style: none; display: grid; gap: 10px; margin-top: 14px; }
    .aside-list li { display: grid; grid-template-columns: 16px 1fr; gap: 10px; font-size: 14.5px; color: var(--ink-2); }
    .aside-list .tick { margin-top: 3px; }
    .aside-note { font-size: 14px; color: var(--muted); }

    /* ---------- Footer ---------- */
    .footer { background: var(--paper); border-top: 1px solid var(--line); padding: 48px 0 40px; font-size: 14.5px; color: var(--ink-2); }
    .footer-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(2, minmax(0, 1fr)); gap: 32px 48px; }
    .footer-brand { display: flex; align-items: center; gap: 10px; color: var(--ink); font-weight: 750; font-size: 16px; }
    .footer-about { margin-top: 12px; max-width: 30em; }
    .footer h2 { font-size: 14.5px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
    .footer ul { list-style: none; display: grid; gap: 6px; }
    .footer a { color: var(--ink-2); text-underline-offset: 3px; }
    .footer a:hover { color: var(--ink); }
    .footer-base { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 32px; font-size: 13px; color: var(--muted); }
    .footer-base a { color: inherit; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1080px) {
      .nav { display: none; }
      .menu-btn { display: inline-flex; }
      .header-cta { margin-left: auto; }
    }
    @media (min-width: 1081px) { .mobile-nav { display: none; } }
    @media (min-width: 861px) { .reel { aspect-ratio: 2.2 / 1; } }
    @media (max-width: 1000px) {
      .est-layout { grid-template-columns: 1fr; }
      .est-aside { position: static; }
    }
    @media (max-width: 860px) {
      .hero-grid, .feature, .about, .contact-grid, .sectors { grid-template-columns: 1fr; }
      .section-head { grid-template-columns: 1fr; margin-bottom: 36px; }
      .services { grid-template-columns: 1fr; gap: 32px; }
      .measures { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 56px; }
      .chapters { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
      .g-row { grid-template-columns: 1fr; }
      .g-axis > div:first-child { display: none; }
      .scheme { grid-template-columns: 1fr; gap: 8px; }
      .sector-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .footer-grid { grid-template-columns: 1fr 1fr; }
      .footer-grid > :first-child { grid-column: 1 / -1; }
      .chips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 600px) {
      .measures { grid-template-columns: 1fr; gap: 36px; }
      .fields { grid-template-columns: 1fr; }
      .marker { width: 112px; padding-left: 24px; }
      .hero-actions .btn { flex: 1 1 auto; }
      .chips { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      .header-cta { display: none; }
      .menu-btn { margin-left: auto; }
      .sector-list { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .ber, .marker-now, .marker-target { animation: none; }
      .btn, .input, .chip { transition: none; }
    }
  </style>
